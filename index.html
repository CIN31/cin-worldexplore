<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界探索计划</title>
<meta name="description" content="世界探索计划。青海 × 甘肃。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0F1A2E; --night-2:#152238; --ink:#E6EBF2; --soft:#9FB0C8; --star:#F3E3B5;
  --lake:#5CB6C1; --sand:#E2A857; --line:#2A3C5A;
  --display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --body:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font:15px/1.6 var(--body)}
a{color:inherit}
#globe{position:fixed;inset:0;z-index:0}
.hud{position:fixed;inset:0;z-index:1;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:28px 24px 24px}
.hud a,.hud button{pointer-events:auto}
.brand .kicker{margin:0;font-size:13px;letter-spacing:.14em;color:var(--star);text-transform:none}
.brand h1{margin:6px 0 0;font:700 clamp(32px,6vw,56px)/1.1 var(--display);letter-spacing:.06em}
.card{pointer-events:auto;align-self:flex-start;background:color-mix(in srgb,var(--night) 72%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;min-width:min(100%,280px);max-width:340px;box-shadow:0 18px 40px -24px #000}
.card.hot{border-color:color-mix(in srgb,var(--lake) 55%,var(--line))}
.card .tag{font-size:12px;letter-spacing:.08em;color:var(--star)}
.card h2{margin:4px 0 0;font:500 22px/1.3 var(--display)}
.card .meta{margin:4px 0 0;color:var(--soft);font-size:13px}
.enter{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 14px;border-radius:999px;border:0;background:var(--lake);color:#0F1A2E;font-weight:600;text-decoration:none;cursor:pointer}
.enter:hover{filter:brightness(1.08)}
.pin{appearance:none;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);cursor:pointer;color:var(--star);text-shadow:0 1px 8px #0F1A2E;font:inherit}
.pin i{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--lake) 70%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--lake) 18%,transparent)}
.pin b{margin-top:6px;font:500 14px/1 var(--display);letter-spacing:.12em}
.fallback{position:fixed;inset:0;z-index:2;display:none;place-items:center;padding:24px;background:var(--night);text-align:center}
.fallback.show{display:grid}
.fallback a{color:var(--lake)}
#veil{position:fixed;inset:0;z-index:3;background:#0F1A2E;opacity:0;pointer-events:none;transition:opacity .5s ease .45s}
.hud{transition:opacity .35s ease,transform .35s ease}
body.leaving .hud{opacity:0;transform:translateY(10px)}
body.leaving #veil{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){
  #veil,.hud{transition:none}
}
@media (max-width:640px){
  .hud{padding:18px 16px 16px}
  .card{max-width:100%;width:100%}
}

/* ===== 视觉升级 ===== */
:root{ --gold:#F2C27A; --ember:#E27D5A; }
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 50% 50%, transparent 55%, rgba(8,13,24,.72) 100%),
             linear-gradient(180deg, rgba(8,13,24,.75) 0%, transparent 22%, transparent 70%, rgba(8,13,24,.85) 100%)}
.hud{z-index:2}
.brand .kicker{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 10px;border-radius:999px;
  background:rgba(242,194,122,.08);border:1px solid rgba(242,194,122,.28);letter-spacing:.12em}
.brand .kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(242,194,122,.6);animation:beacon 2.4s ease-out infinite}
@keyframes beacon{0%{box-shadow:0 0 0 0 rgba(242,194,122,.55)}70%{box-shadow:0 0 0 9px rgba(242,194,122,0)}100%{box-shadow:0 0 0 0 rgba(242,194,122,0)}}
.brand h1{margin-top:12px;font-size:clamp(38px,7vw,76px);letter-spacing:.08em;
  background:linear-gradient(95deg,#FFF6DD 0%,var(--gold) 45%,var(--ember) 80%,#9FC7D3 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 24px rgba(242,194,122,.18))}
.brand .rule{display:block;width:72px;height:2px;margin-top:14px;background:linear-gradient(90deg,var(--gold),transparent)}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.card{position:relative;overflow:hidden;max-width:360px;padding:18px 20px 16px;border-radius:18px;
  background:linear-gradient(160deg,rgba(24,36,60,.78),rgba(12,20,36,.82));border:1px solid rgba(159,176,200,.18)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,#2F8FA3,var(--gold),var(--ember),#4F78A8)}
.card.hot{border-color:rgba(242,194,122,.45);box-shadow:0 18px 50px -20px rgba(242,194,122,.35)}
.card .tag{display:flex;align-items:center;gap:8px}
.card .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.card h2{font-weight:700;font-size:26px;margin-top:6px}
.card .route{margin:6px 0 0;font-size:13px;color:#C5CFDD;letter-spacing:.02em}
.card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:14px 0 0;padding:10px 0 0;border-top:1px solid rgba(159,176,200,.16)}
.card .stats div{display:flex;flex-direction:column}
.card .stats b{font:700 20px/1.1 var(--display);color:#fff;font-variant-numeric:tabular-nums}
.card .stats b small{font-size:11px;color:var(--soft);font-weight:400;margin-left:2px}
.card .stats span{font-size:11px;color:var(--soft);margin-top:2px}
.card .cd{margin:12px 0 0;font-size:13px;color:var(--soft)}
.card .cd b{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:600;margin-left:4px}
.enter{margin-top:14px;padding:10px 18px;background:linear-gradient(135deg,var(--gold),var(--ember));color:#1A1206;box-shadow:0 8px 24px -10px rgba(226,125,90,.7)}
.enter::after{content:"→";transition:transform .2s ease}
.enter:hover::after{transform:translateX(3px)}
.coord{pointer-events:none;text-align:right;font-size:11px;letter-spacing:.14em;color:rgba(159,176,200,.7);font-variant-numeric:tabular-nums;line-height:1.7}
.coord b{display:block;color:rgba(243,227,181,.85);font-weight:500}
.pin{color:#FFF1D2}
.pin i{width:10px;height:10px;background:var(--gold);box-shadow:0 0 0 3px rgba(242,194,122,.25),0 0 18px 4px rgba(242,194,122,.55)}
.pin b{font-weight:700;letter-spacing:.2em;text-shadow:0 0 12px rgba(242,194,122,.6),0 1px 6px #0F1A2E}
@media (max-width:640px){
  .bottom{flex-direction:column;align-items:stretch}
  .coord{display:none}
  .card{max-width:100%}
  .brand h1{font-size:40px}
  .card{padding:14px 16px 12px}
  .card h2{font-size:22px}
  .card .route{display:none}
  .card .stats{margin-top:10px;padding-top:8px}
  .card .cd{margin-top:8px}
  .enter{margin-top:10px;padding:8px 16px}
}

/* ===== 首页充实：右侧旅程档案 ===== */
.side{position:fixed;z-index:2;top:28px;right:24px;max-height:calc(100vh - 92px);width:340px;display:flex;flex-direction:column;gap:12px;pointer-events:none}
.panel{pointer-events:auto;background:linear-gradient(160deg,rgba(24,36,60,.72),rgba(12,20,36,.78));backdrop-filter:blur(10px);
  border:1px solid rgba(159,176,200,.16);border-radius:16px;padding:14px 16px;box-shadow:0 18px 40px -24px #000}
.panel h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;font:500 12px/1 var(--body);letter-spacing:.14em;color:var(--star)}
.panel h3 span{letter-spacing:0;color:var(--soft);font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tiles div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 0 6px;text-align:center}
.tiles b{display:block;font:700 26px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.tiles i{font-style:normal;font-size:11px;color:var(--soft)}
.spark{display:block;width:100%;height:64px;margin-top:4px}
.days{list-style:none;margin:0;padding:0;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(159,176,200,.3) transparent}
.days li a{display:grid;grid-template-columns:14px 44px 1fr auto;align-items:center;gap:8px;padding:7px 6px;border-radius:9px;text-decoration:none;color:var(--ink)}
.days li a:hover,.days li a:focus-visible,.days li a.on{background:rgba(242,194,122,.09)}
.days .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.days .dt{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.days .ti{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days .km{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
.panel.list{flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
.next{pointer-events:auto;border:1px dashed rgba(159,176,200,.3);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;color:var(--soft);font-size:13px}
.next b{font:500 14px var(--display);color:#C5CFDD;letter-spacing:.1em}
.next i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1px dashed rgba(159,176,200,.45);display:grid;place-items:center;font-size:14px}
.coord{position:fixed;right:24px;bottom:22px}
.bottom{padding-right:360px}
.chips{display:none}
.stop{pointer-events:none;display:flex;align-items:center;gap:4px;transform:translate(-4px,-50%);font-size:12px;color:#FFF1D2;text-shadow:0 1px 6px #0F1A2E;white-space:nowrap;opacity:0;transition:opacity .3s}
.stop i{width:5px;height:5px;border-radius:50%;background:#FFF1D2;box-shadow:0 0 6px rgba(242,194,122,.8)}
body.near .stop{opacity:1}
body.near .pin{opacity:0;transition:opacity .3s}
@media (max-width:1100px){
  .side{display:none}
  .bottom{padding-right:0}
  .chips{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;margin:0 0 10px;scrollbar-width:none}
  .chips a{flex:none;display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:12px;padding:5px 10px;border-radius:999px;
    background:rgba(15,26,46,.7);border:1px solid rgba(159,176,200,.2);backdrop-filter:blur(6px)}
  .chips a::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
}
@media (min-width:1101px){ .card .cd{display:none} }
</style>
</head>
<body>
<div id="globe" role="img" aria-label="可旋转的地球，青海和甘肃已点亮"></div>
<div class="hud">
  <header class="brand">
    <p class="kicker">已点亮 1 站</p>
    <h1>世界探索计划</h1>
    <span class="rule" aria-hidden="true"></span>
  </header>
  <div class="bottom">
  <div class="bottom-left">
  <nav class="chips" id="chips" aria-label="按天进入行程"></nav>
  <article class="card" id="card">
    <div class="tag" id="card-tag">青海 × 甘肃</div>
    <h2 id="card-title">青甘大环线</h2>
    <p class="meta" id="card-meta">2026/9/26–10/4 · 西宁出发，环线回到西宁</p>
    <p class="route">西宁 → 柴达木 → 敦煌 → 河西走廊 → 祁连</p>
    <div class="stats">
      <div><b>9<small>天</small></b><span>行程</span></div>
      <div><b>2,750<small>km</small></b><span>参考里程</span></div>
      <div><b>4<small>人</small></b><span>同行</span></div>
    </div>
    <p class="cd" id="cd">距出发<b id="cd-v">--</b></p>
    <a class="enter" id="enter" href="./qinggan/index.html">进入行程</a>
  </article>
  </div>
  <div class="coord" id="coord" aria-hidden="true"><b id="coord-v">N 36.60°　E 99.20°</b>ALT 1.85</div>
  </div>
</div>
<aside class="side" aria-label="旅程档案">
  <section class="panel">
    <h3>出发倒计时 <span>9/26 07:30 西宁</span></h3>
    <div class="tiles"><div><b id="t-d">--</b><i>天</i></div><div><b id="t-h">--</b><i>时</i></div><div><b id="t-m">--</b><i>分</i></div><div><b id="t-s">--</b><i>秒</i></div></div>
  </section>
  <section class="panel">
    <h3>沿途海拔 <span>1140–3790 m</span></h3>
    <svg class="spark" id="spark" viewBox="0 0 300 64" preserveAspectRatio="none" aria-hidden="true"></svg>
  </section>
  <section class="panel list">
    <h3>旅程档案 <span>9 天 · 约 2,750 km</span></h3>
    <ul class="days" id="days"></ul>
  </section>
  <div class="next"><b>下一站</b><span>待点亮</span><i>+</i></div>
</aside>
<div class="fallback" id="fallback">
  <div>
    <h1>世界探索计划</h1>
    <p>地球加载失败时，可以直接进入行程。</p>
    <p><a href="./qinggan/index.html">青甘大环线 →</a></p>
  </div>
</div>
<div id="veil" aria-hidden="true"></div>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.41.4/dist/globe.gl.min.js"></script>
<script>

const ROUTE = [[36.62,101.78],[36.49,101.57],[36.44,101.10],[36.58,100.49],[36.79,99.08],[37.83,95.27],[37.42,94.15],[37.57,93.68],[38.87,93.45],[39.39,94.34],[40.14,94.66],[40.43,95.80],[39.81,98.22],[38.97,100.04],[38.93,100.45],[38.24,100.94],[38.08,100.72],[38.18,100.25],[37.47,101.62],[37.36,101.42],[36.62,101.78]];
(function(){
  const start = new Date("2026-09-26T07:30:00+08:00"), end = new Date("2026-10-04T23:59:59+08:00");
  const pad = n => String(n).padStart(2,"0");
  function tick(){
    const now = new Date(), el = document.getElementById("cd"), v = document.getElementById("cd-v");
    if (!el) return;
    if (now < start) { let t = Math.floor((start-now)/1000); const d = Math.floor(t/86400); t%=86400;
      v.textContent = `${d} 天 ${pad(Math.floor(t/3600))}:${pad(Math.floor(t%3600/60))}:${pad(t%60)}`; }
    else if (now <= end) { el.firstChild.textContent = "旅途中"; v.textContent = `第 ${Math.floor((now-start)/864e5)+1} 天`; }
    else { el.firstChild.textContent = "已完成"; v.textContent = "青甘大环线"; }
  }
  tick(); setInterval(tick, 1000);
})();

const DAYLIST = [
  {d:"9/26", t:"西宁 → 茶卡", km:360, c:"#2F8FA3", at:[36.6,100.4]},
  {d:"9/27", t:"茶卡 → 水上雅丹", km:630, c:"#C58B3A", at:[37.5,96.2]},
  {d:"9/28", t:"水上雅丹 → 敦煌", km:450, c:"#6B6F86", at:[38.9,94.0]},
  {d:"9/29", t:"莫高窟", km:30, c:"#B0652F", at:[40.05,94.8]},
  {d:"9/30", t:"鸣沙山月牙泉", km:10, c:"#D9A23F", at:[40.09,94.67]},
  {d:"10/1", t:"敦煌 → 嘉峪关", km:400, c:"#A7743D", at:[40.1,96.5]},
  {d:"10/2", t:"七彩丹霞 · 张掖", km:250, c:"#C8553D", at:[39.3,99.2]},
  {d:"10/3", t:"张掖 → 祁连", km:240, c:"#5E8C4A", at:[38.4,100.6]},
  {d:"10/4", t:"祁连 → 西宁", km:380, c:"#4F78A8", at:[37.2,101.2]}
];
(function(){
  const li = (x,i) => `<li><a href="./qinggan/index.html#day-${i}" data-i="${i}" style="--c:${x.c}"><span class="dot"></span><span class="dt">${x.d}</span><span class="ti">${x.t}</span><span class="km">${x.km} km</span></a></li>`;
  document.getElementById("days").innerHTML = DAYLIST.map(li).join("");
  document.getElementById("chips").innerHTML = DAYLIST.map((x,i)=>`<a href="./qinggan/index.html#day-${i}" style="--c:${x.c}">${x.d} ${x.t}</a>`).join("");
  // 海拔迷你曲线
  const P = [[0,2275],[90,3520],[210,3200],[360,3059],[770,3170],[990,2700],[1250,3648],[1440,1140],[1880,1600],[2130,1480],[2290,3685],[2370,2800],[2600,3790],[2750,2275]];
  const X = k => k/2750*300, Y = a => 60 - (a-900)/(4000-900)*54;
  let dstr = `M${X(P[0][0])},${Y(P[0][1])}`;
  for (let i=1;i<P.length;i++){ const [x0,y0]=[X(P[i-1][0]),Y(P[i-1][1])], [x1,y1]=[X(P[i][0]),Y(P[i][1])], mx=(x0+x1)/2; dstr += ` C${mx},${y0} ${mx},${y1} ${x1},${y1}`; }
  document.getElementById("spark").innerHTML = `<defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#2F8FA3"/><stop offset=".45" stop-color="#D9A23F"/><stop offset=".75" stop-color="#C8553D"/><stop offset="1" stop-color="#4F78A8"/></linearGradient>
    <linearGradient id="sf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C27A" stop-opacity=".28"/><stop offset="1" stop-color="#F2C27A" stop-opacity="0"/></linearGradient></defs>
    <path d="${dstr} L300,64 L0,64 Z" fill="url(#sf)"/><path d="${dstr}" fill="none" stroke="url(#sg)" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  // 倒计时方块
  const start = new Date("2026-09-26T07:30:00+08:00"), pad = n => String(n).padStart(2,"0");
  function tick(){ let t = Math.max(0, Math.floor((start - new Date())/1000));
    document.getElementById("t-d").textContent = Math.floor(t/86400); t%=86400;
    document.getElementById("t-h").textContent = pad(Math.floor(t/3600));
    document.getElementById("t-m").textContent = pad(Math.floor(t%3600/60));
    document.getElementById("t-s").textContent = pad(t%60); }
  tick(); setInterval(tick, 1000);
})();
const TRIPS = [
  {
    id: "qinggan",
    name: "青甘大环线",
    href: "./qinggan/index.html",
    regions: ["青海省", "甘肃省"],
    kicker: "青海 × 甘肃",
    date: "2026/9/26–10/4",
    summary: "西宁出发，环线回到西宁"

const REGION_TRIP = Object.fromEntries(TRIPS.flatMap(t => t.regions.map(r => [r, t])));
const lit = GEO.features.map(f => Object.assign({}, f, { trip: REGION_TRIP[f.properties.name] }));
const WORLD_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function showTrip(trip){
  if (!trip) return;
  $("#card-tag").textContent = trip.kicker;
  $("#card-title").textContent = trip.name;
  $("#card-meta").textContent = trip.date + " · " + trip.summary;
  $("#enter").href = trip.href;
}
function $(s){ return document.querySelector(s); }

function fail(){ $("#fallback").classList.add("show"); }

function go(href){
  if (!href || document.body.classList.contains("leaving")) return;
  if (reduceMotion) { location.href = href; return; }
  document.body.classList.add("leaving");
  setTimeout(() => { location.href = href; }, 1100);
}

$("#enter").addEventListener("click", e => {
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  go($("#enter").href);
});

if (typeof Globe !== "function") fail();
else try {
  let hover = null;
  const capColor = d => d.trip
    ? (d === hover ? "rgba(242,194,122,0.50)" : "rgba(242,194,122,0.30)")
    : "rgba(36,52,78,0.28)";
  const altitude = d => d.trip ? (d === hover ? 0.045 : 0.018) : 0.004;
  const el = document.getElementById("globe");
  const world = Globe()(el)
    .backgroundColor("#0F1A2E")
    .backgroundImageUrl("https://cdn.jsdelivr.net/npm/three-globe/example/img/night-sky.png")
    .globeImageUrl("https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-dark.jpg")
    .showAtmosphere(true)
    .atmosphereColor("#7FB3D9")
    .atmosphereAltitude(0.18)
    .polygonAltitude(altitude)
    .polygonCapColor(capColor)
    .polygonSideColor(d => d.trip ? "rgba(242,194,122,0.16)" : "rgba(15,26,46,0.2)")
    .polygonStrokeColor(d => d.trip ? "rgba(255,236,196,0.75)" : "rgba(80,104,140,0.35)")
    .showGraticules(true)
    .ringsData([{ lat: 37.15, lng: 99.05 }])
    .ringColor(() => t => `rgba(242,194,122,${(1 - t) * 0.8})`)
    .ringMaxRadius(7)
    .ringPropagationSpeed(2.2)
    .ringRepeatPeriod(1600)
    .ringAltitude(0.021)
    .pathsData([ROUTE])
    .pathPoints(d => d)
    .pathPointLat(p => p[0])
    .pathPointLng(p => p[1])
    .pathPointAlt(0.024)
    .pathColor(() => ["rgba(255,241,210,0.95)", "rgba(226,125,90,0.95)"])
    .pathStroke(1.6)
    .pathDashLength(0.06)
    .pathDashGap(0.012)
    .pathDashAnimateTime(reduceMotion ? 0 : 14000)
    .pathTransitionDuration(0)

    .polygonCapCurvatureResolution(6)
    .polygonsTransitionDuration(220)
    .polygonLabel(d => d.trip ? `<b>${d.trip.name}</b><br>${d.trip.kicker}` : "")
    .onPolygonHover(d => {
      hover = d && d.trip ? d : null;
      world.polygonAltitude(altitude).polygonCapColor(capColor);
      $("#card").classList.toggle("hot", !!hover);
      showTrip(hover ? hover.trip : TRIPS[0]);
    })
    .onPolygonClick(d => {
      if (!d || !d.trip) return;
      go(d.trip.href);
    })
    .htmlElementsData([{ lat: 37.15, lng: 99.05, trip: TRIPS[0] }].concat([
      {lat:36.62,lng:101.78,t:"西宁"},{lat:36.79,lng:99.08,t:"茶卡"},{lat:37.57,lng:93.68,t:"水上雅丹"},
      {lat:40.14,lng:94.66,t:"敦煌"},{lat:39.81,lng:98.22,t:"嘉峪关"},{lat:38.93,lng:100.45,t:"张掖"},{lat:38.18,lng:100.25,t:"祁连"}]))
    .htmlElement(d => {
      if (!d.trip) { const n = document.createElement("span"); n.className = "stop"; n.innerHTML = `<i></i>${d.t}`; return n; }
      const node = document.createElement("button");
      node.className = "pin";
      node.type = "button";
      node.setAttribute("aria-label", d.trip.name);
      node.innerHTML = "<i></i><b>青甘</b>";
      node.onclick = e => { e.stopPropagation(); go(d.trip.href); };
      return node;
    })
    .htmlAltitude(0.03)
    .pointOfView(innerWidth < 640 ? { lat: 16, lng: 99.2, altitude: 2.4 } : { lat: 36.6, lng: 99.2, altitude: 1.85 }, 0);

  const ctrl = world.controls();
  ctrl.enableDamping = true;
  ctrl.autoRotate = !reduceMotion;
  ctrl.autoRotateSpeed = 0.32;
  ctrl.minDistance = 140;
  ctrl.maxDistance = 520;
  ctrl.addEventListener("start", () => { ctrl.autoRotate = false; });
  document.querySelectorAll("#days a").forEach(a => {
    a.addEventListener("mouseenter", () => {
      const x = DAYLIST[+a.dataset.i]; ctrl.autoRotate = false;
      world.pointOfView({ lat: x.at[0], lng: x.at[1], altitude: 0.9 }, 800);
      world.ringsData([{ lat: x.at[0], lng: x.at[1] }]);
    });
  });
  document.getElementById("days").addEventListener("mouseleave", () => {
    world.pointOfView({ lat: 36.6, lng: 99.2, altitude: 1.85 }, 900);
    world.ringsData([{ lat: 37.15, lng: 99.05 }]);
  });
  const coordV = document.getElementById("coord-v"), coordBox = document.getElementById("coord");
  ctrl.addEventListener("change", () => {
    const pov = world.pointOfView();
    const lat = pov.lat, lng = ((pov.lng + 540) % 360) - 180;
    coordV.textContent = `${lat >= 0 ? "N" : "S"} ${Math.abs(lat).toFixed(2)}°　${lng >= 0 ? "E" : "W"} ${Math.abs(lng).toFixed(2)}°`;
    coordBox.lastChild.textContent = `ALT ${pov.altitude.toFixed(2)}`;
    document.body.classList.toggle("near", pov.altitude < 1.2);
  });

  go = function(href){
    if (!href || document.body.classList.contains("leaving")) return;
    if (reduceMotion) { location.href = href; return; }
    document.body.classList.add("leaving");
    ctrl.autoRotate = false;
    ctrl.enabled = false;
    world.pointOfView({ lat: 37.15, lng: 99.05, altitude: 0.48 }, 900);
    setTimeout(() => { location.href = href; }, 1100);
  };

  const mat = world.globeMaterial();
  if (mat) {
    mat.shininess = 8;
    if (mat.emissive) mat.emissive.setHex(0x0a1424);
  }

  function size(){
    const shift = innerWidth > 1100 ? 360 : 0;
    el.style.left = -shift + "px"; el.style.width = (innerWidth + shift) + "px";
    world.width(innerWidth + shift).height(innerHeight);
  }
  size();
  addEventListener("resize", size);
  world.polygonsData(lit);

  (async () => {
    let countries = [];
    try {
      const topo = await fetch(WORLD_URL).then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      });
      countries = topojson.feature(topo, topo.objects.countries).features
        .filter(d => d.id !== 10 && d.id !== "010");
    } catch (e) { /* 世界底图失败时仍可点青海、甘肃 */ }
    world.polygonsData(countries.concat(lit));
  })();
} catch (e) { fail(); }
</script>
